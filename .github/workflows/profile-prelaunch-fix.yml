name: Profile mathematics prelaunch fixes

on:
  pull_request:
    paths:
      - scripts/apply_profile_fix.py
      - scripts/repair_and_run_profile_fix.py
      - scripts/run-profile-fix.trigger
      - tests/profile_fix_browser_test.mjs
      - .github/workflows/profile-prelaunch-fix.yml
  push:
    branches:
      - fix/prelaunch-profile-math-v2-1
    paths:
      - scripts/apply_profile_fix.py
      - scripts/repair_and_run_profile_fix.py
      - scripts/run-profile-fix.trigger
      - tests/profile_fix_browser_test.mjs
      - .github/workflows/profile-prelaunch-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Sync latest uploaded files from main
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF reader
        run: pip install pypdf

      - name: Download official FIPI 2026 mathematics package
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --output /tmp/ma_11_2026.zip \
            https://doc.fipi.ru/ege/demoversii-specifikacii-kodifikatory/2026/ma_11_2026.zip
          python -m zipfile -t /tmp/ma_11_2026.zip

      - name: Apply all Codex audit fixes
        env:
          FIPI_ZIP: /tmp/ma_11_2026.zip
        run: python scripts/repair_and_run_profile_fix.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependency
        run: npm install --no-save jsdom@26

      - name: Run browser smoke test
        run: node tests/profile_fix_browser_test.mjs

      - name: Validate package files
        run: |
          git diff --check
          python -m zipfile -t ege-matematika-profil-demoversiya-VERIFIED-PACKAGE-v2-1-fixed.zip
          python -m py_compile scripts/apply_profile_fix.py scripts/repair_and_run_profile_fix.py
          grep -q 'source/ege-2026-matematika-profil-demoversiya.pdf' ege-matematika-profil-demoversiya-MANIFEST.txt
          grep -q 'source/ege-2026-matematika-profil-specifikatsiya.pdf' ege-matematika-profil-demoversiya-MANIFEST.txt
          grep -q 'source/ege-2026-matematika-kodifikator.pdf' ege-matematika-profil-demoversiya-MANIFEST.txt
          test ! -e official-FIPI-demo-2026-profile-math.pdf

      - name: Commit corrected package
        run: |
          rm -rf node_modules package-lock.json package.json
          git add -A
          if git diff --cached --quiet; then
            echo "No changes were required."
          else
            git commit -m "Fix profile mathematics prelaunch audit findings"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Upload corrected ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ege-matematika-profil-demoversiya-v2-1-fixed
          path: ege-matematika-profil-demoversiya-VERIFIED-PACKAGE-v2-1-fixed.zip
          if-no-files-found: error
          retention-days: 30
